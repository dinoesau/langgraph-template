<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Helvetica, Arial, sans-serif">
<rect x="4" y="4" width="1232" height="792" rx="18" fill="#f4f4f4" stroke="#333" stroke-width="3"/>
<text x="620" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a5a00">Clean Architecture — target build reference v7</text>
<text x="620" y="64" text-anchor="middle" font-size="12" font-style="italic" fill="#555">verified 2026-10-18: #1 confirmed tradeoff, #2 target-only + wiki 3.3 vs 6.1 conflict</text>

<!-- rings -->
<circle cx="300" cy="390" r="250" fill="#a9cfe8" stroke="#333" stroke-width="2.5"/>
<circle cx="300" cy="390" r="190" fill="#93d193" stroke="#333" stroke-width="2.5"/>
<circle cx="300" cy="390" r="135" fill="#ef9e9e" stroke="#333" stroke-width="2.5"/>
<circle cx="300" cy="390" r="70" fill="#fdf3b0" stroke="#333" stroke-width="2.5"/>

<!-- blue ring: layer name at top-center, members at mid-sides and bottom -->
<text x="300" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Frameworks · Drivers</text>
<text x="80" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(-90 80 390)">Devices</text>
<text x="520" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" transform="rotate(90 520 390)">Web</text>
<text x="128" y="545" font-size="15" font-weight="bold" fill="#333" transform="rotate(38 128 545)">DB</text>
<text x="432" y="560" font-size="15" font-weight="bold" fill="#333" transform="rotate(-38 432 560)">UI</text>
<text x="300" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">External Interfaces</text>

<!-- green ring labels: both lines sit inside the green band at top-center (200-255) -->
<text x="300" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Controllers · Presenters · Gateways</text>
<text x="300" y="241" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">chat · auth · health · metrics · deps</text>

<!-- red ring: block centered in the red band (255-320), clear of both strokes -->
<text x="300" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Use Cases</text>
<text x="300" y="300" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">chat · tools · RAG · router · workers · grader</text>

<!-- entities -->
<text x="300" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Entities</text>
<text x="300" y="402" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">GraphState · User · Session</text>

<!-- inward arrows outside circles -->
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" stroke="#333" fill="none"/></marker></defs>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ah)">
<line x1="150" y1="716" x2="190" y2="716"/>
<line x1="330" y1="716" x2="370" y2="716"/>
</g>
<text x="30" y="720" font-size="11" font-style="italic" fill="#333">dependencies point inward</text>

<!-- right panel -->
<g font-size="12.5">
<text x="600" y="100" font-size="17" font-weight="bold" fill="#333">Entities — center, knows nothing outside</text>
<text x="600" y="120" fill="#333">● GraphState (MessagesState tradeoff until the tool loop) · ● User · ● Session</text>
<text x="600" y="138" fill="#333">○ Trajectory + EvalReport (scored JSON on demand)</text>

<text x="600" y="166" font-size="17" font-weight="bold" fill="#333">Use Cases — loop owns state, tools, pure routing</text>
<text x="600" y="186" fill="#333">● echo (transitional) → ○ chat + tool_call loop</text>
<text x="600" y="204" fill="#333">○ booking tools · ○ retrieval + generator</text>
<text x="600" y="222" fill="#333">○ router triage · ○ workers fan-out · ○ grader</text>

<text x="600" y="250" font-size="17" font-weight="bold" fill="#333">Adapters — HTTP translates, services adapt</text>
<text x="600" y="270" fill="#333">● chat/stream + health handlers · ● ChatResponse · ● api/deps</text>
<text x="600" y="288" fill="#333">● lifespan + checkpointer + boundary · ○ user/session CRUD</text>
<text x="600" y="306" fill="#333">○ auth handlers + tokens · ○ metrics handler</text>
<text x="600" y="324" fill="#333">○ llm registry + fallback · ● memory search/store</text>
<text x="600" y="342" fill="#333">● cache front · ○ limiter + middleware · ○ eval runner</text>
<text x="600" y="360" fill="#333">Rule: handlers read via api/deps, never direct service imports.</text>

<text x="600" y="388" font-size="17" font-weight="bold" fill="#333">Drivers — swappable without touching the core</text>
<text x="600" y="408" fill="#333">● FastAPI/uvicorn · ● Postgres · ● Alembic/SQLAlchemy · ● LangGraph</text>
<text x="600" y="426" fill="#333">● Postgres store + pool · ● Valkey · ○ OpenAI/Anthropic/Google</text>
<text x="600" y="444" fill="#333">○ LangSmith/Langfuse · ○ Prometheus/Grafana · ○ Compose + CI</text>

<text x="600" y="472" font-size="17" font-weight="bold" fill="#333">Full-turn flow (target only, not shipped)</text>
<text x="600" y="492" font-family="monospace" font-size="12" fill="#333">target: token → recall → loop(thread) → fallback → tools</text>
<text x="600" y="510" font-family="monospace" font-size="12" fill="#333">→ persist → reply → background memory store</text>
<text x="600" y="528" font-size="12" font-style="italic" fill="#333">shipped: token → loop(thread) only, no recall. Fix wiki 3.3 vs 6.1 first.</text>

<text x="600" y="556" font-size="17" font-weight="bold" fill="#333">Build order</text>
<text x="600" y="576" fill="#333">memory → tool loop → auth → patterns →</text>
<text x="600" y="594" fill="#333">observability → journeys + evals → stack + CI.</text>
<text x="600" y="612" fill="#333">New modules enter their ring; seams S1–S10 do not move.</text>
</g>
</svg>
