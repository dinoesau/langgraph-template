[project]
name = "langgraph-template"
version = "0.1.0"
description = "Minimal LangGraph starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "greenlet>=3.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "langgraph-checkpoint-postgres>=3.2.0",
    "redis>=5.0",
    "langgraph-store-postgres>=0.1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=3.0",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "slowapi>=0.1.9,<0.2",
    "email-validator>=2.0",
    "python-multipart>=0.0.20",
    "prometheus-client>=0.20",
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "codespell>=2.4.3",
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.3",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api", "src/core", "src/models", "src/services", "src/schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.codespell]
ignore-words = ".codespellignore"

[tool.uv]
package = true
