[project]
name = "langgraph-template"
version = "0.1.0"
description = "Minimal LangGraph starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "langgraph-cli>=0.3",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
package = true
