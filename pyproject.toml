[project]
name = "langgraph-template"
version = "0.1.0"
description = "Minimal LangGraph starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
    "langgraph-checkpoint-postgres>=3.2.0",
    "redis>=5.0",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "httpx>=0.27",
    "langgraph-cli>=0.3",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/api", "src/api/v1", "src/core", "src/models", "src/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
explicit_package_bases = true

[tool.uv]
package = true
